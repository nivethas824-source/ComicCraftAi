<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Comic Preview - ComicCraft</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 30px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; }
        .page-title { text-align: center; margin-bottom: 25px; color: #2c3e50; }
        .panel-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 1px solid #e0e0e0;
        }
        .panel-card h3 { margin-bottom: 15px; color: #111111; }
        .panel-content { display: flex; flex-direction: column; gap: 15px; }
        .panel-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
        .scene-desc { font-style: italic; color: #555555; font-size: 14px; margin-bottom: 8px; }
        .story-text { white-space: pre-line; line-height: 1.6; color: #222222; font-size: 15px; }
        .btn-container { text-align: center; margin-top: 20px; margin-bottom: 40px; }
        .download-btn {
            background-color: #28a745;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .download-btn:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="page-title">📖 Your Comic Preview</h2>
        
        {% for item in layout %}
        <div class="panel-card">
            <h3>Panel {{ item.panel }}: {{ item.title }}</h3>
            <div class="panel-content">
                <img class="panel-img" src="/{{ item.image_path }}" alt="Panel {{ item.panel }} Image">
                <div class="scene-desc">{{ item.scene_description }}</div>
                <div class="story-text">{{ item.text }}</div>
            </div>
        </div>
        {% endfor %}

        <div class="btn-container">
            <a class="download-btn" href="/export-success?pdf_path={{ pdf_path }}">Download Your Comic as PDF</a>
        </div>
    </div>
</body>
</html>
