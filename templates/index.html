<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft - AI Comic Story Creator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1511497584788-876761c11969?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .form-card {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        .form-card h2 { text-align: center; margin-bottom: 20px; color: #2c3e50; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: #34495e; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group textarea { resize: vertical; height: 80px; }
        .submit-btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>✏️ Create Your Comic</h2>
        <form action="/generate" method="POST">
            <div class="form-group">
                <label for="story_prompt">Story Prompt:</label>
                <textarea id="story_prompt" name="story_prompt" required placeholder="A brave fox explores an enchanted forest..."></textarea>
            </div>
            <div class="form-group">
                <label for="character_name">Main Character Name:</label>
                <input type="text" id="character_name" name="character_name" required placeholder="Free">
            </div>
            <div class="form-group">
                <label for="setting">Setting:</label>
                <select id="setting" name="setting">
                    <option value="Forest">Forest</option>
                    <option value="School">School</option>
                    <option value="Space">Space</option>
                    <option value="City">City</option>
                </select>
            </div>
            <div class="form-group">
                <label for="tone">Story Tone:</label>
                <select id="tone" name="tone">
                    <option value="Dramatic">Dramatic</option>
                    <option value="Funny">Funny</option>
                    <option value="Light-hearted">Light-hearted</option>
                    <option value="Poetic">Poetic</option>
                </select>
            </div>
            <div class="form-group">
                <label for="art_style">Art Style:</label>
                <select id="art_style" name="art_style">
                    <option value="Realistic">Realistic</option>
                    <option value="Anime">Anime</option>
                    <option value="Comic Book">Comic Book</option>
                    <option value="Pixel Art">Pixel Art</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">Generate Comic</button>
        </form>
    </div>
</body>
</html>
